[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexsec-dfir"
version = "0.2.0"
description = "Offline evidence-first forensic CTF workbench with specialist-tool adapters"
requires-python = ">=3.10"

[project.scripts]
nexsec-dfir = "nexsec_dfir.__main__:main"

[tool.setuptools.packages.find]
include = ["nexsec_dfir*"]

[tool.setuptools.package-data]
nexsec_dfir = ["questions.json"]
